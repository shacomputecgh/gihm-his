name: CI

# Quality gate for every push to main and every pull request. The repository
# previously had no CI at all: typechecks and the 1,396 unit tests were run by
# hand, which is exactly how a red suite reaches main unnoticed.
#
# The API test suite creates its own database (apps/api/tests/global-setup.ts
# runs `prisma db push --force-reset` against tests/.tmp/test.db), so no service
# containers or secrets are required — this job runs on a bare runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push does not need to finish: cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hermetic by default: no real SMS/WhatsApp/mail gateway is ever reached
      # from CI. The test config nulls these too; this is belt and braces.
      NODE_ENV: test
      RATE_LIMIT_MAX: '100000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck (api, web, e2e specs)
        run: npm run typecheck

      - name: API tests
        run: npm test

      - name: Web tests
        run: npm run test -w apps/web

      - name: Production web build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
